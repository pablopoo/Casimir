pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
 access_log off;
 client_body_temp_path /tmp/client_body; proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
 resolver 127.0.0.11 valid=1s ipv6=off;
 server { listen 8080; client_max_body_size 64m;
  location / {
   set $casimir_api casimir-mvp-a-api:3000;
   proxy_pass http://$casimir_api$request_uri;
   proxy_set_header Host $http_host;
   proxy_request_buffering off; proxy_buffering off;
   proxy_connect_timeout 2s; proxy_read_timeout 60s;
  }
 }
}
